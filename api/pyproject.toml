[project]
name = "docchat"
version = "0.3.0"
description = "Chat with your PDFs and measure which RAG setup actually works."
requires-python = ">=3.13"
dependencies = [
    "celery[redis]>=5.7.0",
    "fastapi>=0.162.0",
    "langchain-anthropic>=1.7.12",
    "langchain-text-splitters>=1.1.3",
    "langchain-voyageai>=0.4.1",
    "numpy>=2.5.5",
    "pinecone>=10.3.0",
    "pydantic-settings>=2.16.2",
    "pypdf>=7.1.1",
    "structlog>=26.1.0",
    "typer>=0.29.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
docchat = "docchat.cli:app"

[build-system]
requires = ["uv_build>=0.11.17,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers", "--strict-config", "--import-mode=importlib", "-m", "not external"]
markers = ["external: calls a real external service and needs its key; run with make test-external"]

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "httpx>=0.28.1",
    "hypothesis>=6.170.17",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]
