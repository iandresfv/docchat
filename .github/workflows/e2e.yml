name: e2e

# Nightly and on demand (label `e2e`). Runs the Playwright suite against the
# client's mock-API build; switch to the compose stack + E2E_BASE_URL once the
# API exists (05-OPS §4).
on:
  schedule:
    - cron: "0 6 * * *"
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: client/.nvmrc
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: client/playwright-report
          retention-days: 7
