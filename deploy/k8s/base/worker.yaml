# Same image as the API, another command: it takes ingestion tasks from Redis. No Service, no
# port: nothing calls the worker.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docchat-worker
  labels:
    app.kubernetes.io/name: docchat-worker
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: docchat-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docchat-worker
        app.kubernetes.io/component: worker
    spec:
      # On SIGTERM Celery stops taking tasks and finishes the running ones (warm shutdown).
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: docchat-api
          imagePullPolicy: IfNotPresent
          # Mingle and gossip coordinate several workers; with one, they only add Redis traffic
          # and a second of startup.
          command:
            - celery
            - --app=docchat.worker.celery_app
            - worker
            - --queues=ingestion
            - --concurrency=2
            - --without-mingle
            - --without-gossip
          envFrom:
            - configMapRef:
                name: docchat-api-config
            - secretRef:
                name: docchat-api-keys
                optional: true
          # The main process and two forked children take about 280 MiB before the first task.
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 1Gi }
          # The worker answers a ping through the broker while its consumer loop is alive.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  celery --app=docchat.worker.celery_app inspect ping --timeout=10
                  --destination="celery@$HOSTNAME"
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: storage, mountPath: /var/lib/docchat/storage }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: storage
          persistentVolumeClaim:
            claimName: docchat-storage
