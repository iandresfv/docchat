# Postgres with the pgvector extension, for the relational data and the pgvector adapter. A
# StatefulSet: a stable name (docchat-postgres-0) and its own volume that survives restarts.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: docchat-postgres
  labels:
    app.kubernetes.io/name: docchat-postgres
    app.kubernetes.io/component: database
spec:
  serviceName: docchat-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: docchat-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docchat-postgres
        app.kubernetes.io/component: database
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999 # the image's postgres user
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.7-pg18-trixie
          env:
            - { name: POSTGRES_USER, value: docchat }
            - { name: POSTGRES_DB, value: docchat }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: docchat-postgres, key: password }
          ports:
            - name: postgres
              containerPort: 5432
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          readinessProbe:
            exec:
              command: [pg_isready, --username=docchat, --dbname=docchat]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, --username=docchat, --dbname=docchat]
            periodSeconds: 10
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            # Postgres 18 images keep the data in /var/lib/postgresql/18/docker.
            - { name: data, mountPath: /var/lib/postgresql }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
---
# Headless (no virtual IP): the name resolves straight to the pod.
apiVersion: v1
kind: Service
metadata:
  name: docchat-postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: docchat-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
